stages:
  - build
  - test
  - release

.build-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$GROUP_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $GROUP_REGISTRY_USER --password-stdin
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$OS$OS_VERSION
  script:
    - echo "Building $ITEM for $OS$OS_VERSION"
    - docker build -f docker/Dockerfile.$OS --pull -t $IMAGE_TAG --build-arg OS_VERSION=$OS_VERSION .
    - docker push $IMAGE_TAG


# Compile and push Docker images for Ubuntu
build-ubuntu:
  extends: .build-image
  variables:
    OS: ubuntu
  parallel:
    matrix:
      - OS_VERSION: ["20.04", "22.04", "24.04"]

# Compile and push Docker images for AlmaLinux
build-alma:
  extends: .build-image
  variables:
    OS: almalinux
  parallel:
    matrix:
      - OS_VERSION: ["9", "10"]

# Run shellcheck on all scripts
shellcheck:
  image: koalaman/shellcheck-alpine:stable
  stage: test
  variables:
    # Ignore warnings on unused variables and non costant source (imported files)
    SHELLCHECK_OPTS: "-x -e SC2034,SC1090"
  script:
    - shellcheck ./epicsmng
    - shellcheck ./install.sh
    - shellcheck ./uninstall.sh
    - shellcheck ./utils/epicsmng-completion.bash
    - shellcheck ./utils/completion_include.bash

# Create docker image corresponding to tag
tag-version:
  stage: release
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$GROUP_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $GROUP_REGISTRY_USER --password-stdin
  variables:
    CURR_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-almalinux9
    NEW_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  script:
    - docker pull $CURR_TAG
    - docker tag $CURR_TAG $NEW_TAG
    - docker push $NEW_TAG
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^v\d+.\d+.\d+$|^v\d+.\d+$|^v\d+/
